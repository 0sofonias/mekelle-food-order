<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e85d04">
<title>Mekelle Food Order</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8f8f8;
  color: #222;
}

header {
  background: #e85d04;
  color: white;
  padding: 22px 18px;
  border-radius: 0 0 22px 22px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

header p {
  margin: 0;
  font-size: 14px;
}

.container {
  padding: 18px;
  max-width: 650px;
  margin: auto;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 22px;
}

h2 {
  font-size: 20px;
  margin-bottom: 14px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 12px;
}

.category {
  border: 1px solid #eee;
  background: white;
  border-radius: 12px;
  padding: 12px 15px;
  white-space: nowrap;
  cursor: pointer;
}

.category.active {
  background: #e85d04;
  color: white;
}

.restaurant {
  background: white;
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: 0 2px 8px #0000000a;
}

.restaurant-image {
  height: 130px;
  background: #ffeadb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
}

.restaurant-info {
  padding: 15px;
}

.restaurant-info h3 {
  margin: 0 0 8px;
}

.restaurant-info p {
  margin: 5px 0;
  color: #666;
  font-size: 14px;
}

.badge {
  display: inline-block;
  margin-top: 8px;
  background: #e5f7e9;
  color: #187438;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 12px;
}

.empty {
  padding: 25px;
  text-align: center;
  color: #777;
}

.cart-bar {
  position: sticky;
  bottom: 10px;
  background: #222;
  color: white;
  padding: 15px;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
  gap: 12px;
}

.cart-bar button {
  background: #e85d04;
  border: 0;
  color: white;
  padding: 10px 15px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* CART PAGE DESIGN */
.cart-panel {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #f8f8f8;
  overflow-y: auto;
  padding: 20px;
}

.cart-panel[hidden] {
  display: none;
}

.cart-content {
  max-width: 600px;
  margin: 0 auto;
  padding-bottom: 30px;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.cart-header h2 {
  margin: 0;
}

.cart-item {
  background: white;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px #0000000a;
}

.cart-item h3 {
  margin: 0 0 8px;
}

.cart-item p {
  margin: 6px 0;
  color: #666;
}

.cart-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.cart-actions button,
.cart-header button,
.cart-checkout {
  border: 0;
  border-radius: 9px;
  padding: 11px 14px;
  cursor: pointer;
  font-weight: bold;
}

.cart-actions button {
  background: #eee;
}

.cart-actions .remove-item {
  background: #ffe5e5;
  color: #b00020;
}

.cart-total {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-top: 18px;
}

.cart-total h3 {
  margin-top: 0;
}

.cart-checkout {
  width: 100%;
  background: #e85d04;
  color: white;
  font-size: 16px;
  margin-top: 12px;
}

.cart-back {
  background: #222;
  color: white;
}
  
footer {
 text-align: center;
  padding: 25px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>🍽️ Mekelle Food Order</h1>
  <p>Your food, your choice, delivered to you.</p>
</header>

<!-- CUSTOMER AUTHENTICATION -->
<section id="auth-panel" class="container">
  <h2>Welcome to Mekelle Food Order</h2>
  <p>Sign in or create an account to place your order.</p>

  <form id="auth-form">
    <label for="auth-email">Email address</label>
    <input
      id="auth-email"
      type="email"
      required
      autocomplete="email"
      placeholder="you@example.com"
      style="display:block;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #ccc;border-radius:8px;font-size:16px"
    >

    <input
      id="auth-password"
      type="password"

<main class="container">

  <input
    class="search"

    type="search"
    placeholder="Search restaurants or food..."
    aria-label="Search restaurants or food"
  >

  <h2>Explore categories</h2>

  <div class="categories">
    <button class="category active"
      data-category="All">🍽️ All</button>

    <button class="category"
      data-category="Traditional">🥘 Traditional</button>

    <button class="category"
      data-category="Fast Food">🍔 Fast Food</button>

    <button class="category"
      data-category="Drinks">🥤 Drinks</button>

    <button class="category"
      data-category="Groceries">🛒 Groceries</button>
  </div>

  <h2>Restaurants in Mekelle</h2>

  <div id="restaurants"></div>

  <div class="cart-bar">

   <!-- CART PAGE -->
<section id="cart-panel" class="cart-panel" hidden>
  <div class="cart-content">
    <div class="cart-header">
      <h2>🛒 Your Shopping Cart</h2>
      <button class="cart-back" onclick="closeCart()">Back</button>
    </div>

    <div id="cart-items"></div>
    <div id="cart-summary"></div>
  </div>
</section>
    
    <div>
      <strong>🛒 My Cart</strong>
      <div id="cart-count">0 items</div>
    </div>

    <button
      id="view-cart"
      onclick="showCart()"
    >View Cart</button>
  </div>

</main>

<footer>
  Mekelle Food Order<br>
  Built for Mekelle, Ethiopia 🇪🇹
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// SUPABASE CONNECTION — KEEP THESE VALUES UNCHANGED
const SUPABASE_URL = "https://vkrnonhmyeblmpkgkllo.supabase.co";
const SUPABASE_KEY = "sb_publishable_KaJTzLho3184lRCIPDQc8A_JcCZ3JBb";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// APP VARIABLES
let restaurants = [];
let selectedCategory = "All";
let cart = [];
let selectedRestaurant = null;
let menuItems = [];
let menuCategories = [];


// LOAD APPROVED RESTAURANTS
async function loadRestaurants() {
  const container = document.getElementById("restaurants");
  container.textContent = "Loading restaurants...";

  const { data, error } = await supabaseClient
    .from("restaurants")
    .select("id, name, description, address, image_url, is_open")
    .eq("is_approved", true)
    .order("name");

  if (error) {
    console.error("Restaurant loading error:", error);
    container.textContent = "Could not load restaurants.";
    return;
  }

  restaurants = data || [];
  renderRestaurants();
}


// DISPLAY RESTAURANTS AND SEARCH RESULTS
function renderRestaurants() {
  const container = document.getElementById("restaurants");
  container.replaceChildren();

  if (selectedRestaurant) {
    renderMenu();
    return;
  }

  const search = document
    .getElementById("search")
    .value.trim().toLowerCase();

  const list = restaurants.filter(r =>
    [r.name, r.description, r.address]
      .some(value =>
        (value || "").toLowerCase().includes(search)
      )
  );

  if (list.length === 0) {
    container.textContent = "No approved restaurants found.";
    return;
  }

  list.forEach(r => {
    const card = document.createElement("article");
    card.className = "restaurant";

    const info = document.createElement("div");
    info.className = "restaurant-info";

    const name = document.createElement("h3");
    name.textContent = r.name;

    const description = document.createElement("p");
    description.textContent =
      r.description || "Restaurant in Mekelle";

    const address = document.createElement("p");
    address.textContent =
      r.address || "Location to be confirmed";

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = r.is_open ? "Open" : "Currently closed";

    const button = document.createElement("button");
    button.textContent = "View Menu";
    button.disabled = !r.is_open;

    button.addEventListener("click", () => openMenu(r));

    info.append(name, description, address, badge, button);
    card.appendChild(info);
    container.appendChild(card);
  });
}


// OPEN A RESTAURANT MENU
async function openMenu(restaurant) {
  selectedRestaurant = restaurant;
  selectedCategory = "All";

  const container = document.getElementById("restaurants");
  container.textContent = "Loading menu...";

  const [categoriesResult, itemsResult] = await Promise.all([
    supabaseClient
      .from("menu_categories")
      .select("id, name")
      .eq("restaurant_id", restaurant.id)
      .order("name"),

    supabaseClient
      .from("menu_items")
      .select("id, category_id, name, description, price, image_url")
      .eq("restaurant_id", restaurant.id)
      .eq("is_available", true)
      .order("name")
  ]);

  if (categoriesResult.error || itemsResult.error) {
    console.error(
      categoriesResult.error || itemsResult.error
    );

    container.textContent =
      "Could not load the menu. Please try again.";

    return;
  }

  menuCategories = categoriesResult.data || [];
  menuItems = itemsResult.data || [];

  renderMenu();
}


// DISPLAY MENU ITEMS AND MENU CATEGORIES
function renderMenu() {
  const container = document.getElementById("restaurants");
  container.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = selectedRestaurant.name + " — Menu";
  container.appendChild(heading);

  const backButton = document.createElement("button");
  backButton.textContent = "← Back to Restaurants";

  backButton.addEventListener("click", () => {
    selectedRestaurant = null;
    selectedCategory = "All";
    renderRestaurants();
  });

  container.appendChild(backButton);

  const categories = document.createElement("div");
  categories.className = "categories";

  ["All", ...menuCategories.map(c => c.name)].forEach(name => {
    const button = document.createElement("button");
    button.className = "category";
    button.textContent = name;

    if (name === selectedCategory) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      selectedCategory = name;
      renderMenu();
    });

    categories.appendChild(button);
  });

  container.appendChild(categories);

  const filteredItems = menuItems.filter(item => {
    if (selectedCategory === "All") {
      return true;
    }

    const category = menuCategories.find(
      c => c.id === item.category_id
    );

    return category && category.name === selectedCategory;
  });

  if (filteredItems.length === 0) {
    const message = document.createElement("p");
    message.textContent = "No food items in this category yet.";
    container.appendChild(message);
    return;
  }

  filteredItems.forEach(item => {
    const card = document.createElement("article");
    card.className = "restaurant";

    const info = document.createElement("div");
    info.className = "restaurant-info";

    const name = document.createElement("h3");
    name.textContent = item.name;

    const description = document.createElement("p");
    description.textContent =
      item.description || "Delicious food";

    const price = document.createElement("p");
    price.textContent =
      Number(item.price).toLocaleString() + " ETB";

    const addButton = document.createElement("button");
    addButton.textContent = "Add to Cart";

    addButton.addEventListener("click", () => {
    addToCart(item, addButton);
    });

    info.append(name, description, price, addButton);
    card.appendChild(info);
    container.appendChild(card);
    });
    }


// ADD FOOD TO CART WITH ANIMATION
function addToCart(item, sourceButton) {
  if (!selectedRestaurant) {
    alert("Please open a restaurant first.");
    return;
  }

  // Keep orders from different restaurants separate.
  if (
    cart.length > 0 &&
    cart.some(entry => entry.restaurantId !== selectedRestaurant.id)
  ) {
    const continueOrder = confirm(
      "Your cart contains food from another restaurant. " +
      "Clear the existing cart and order from this restaurant instead?"
    );

    if (!continueOrder) {
      return;
    }

    cart = [];
  }

  // Animate the food toward the cart.
  animateFoodToCart(sourceButton);

  const existing = cart.find(
    entry =>
      entry.id === item.id &&
      entry.restaurantId === selectedRestaurant.id
  );

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      id: item.id,
      name: item.name,
      price: Number(item.price),
      quantity: 1,
      restaurantId: selectedRestaurant.id,
      restaurantName: selectedRestaurant.name
    });
  }

  updateCartDisplay();
}

// FOOD FLYING ANIMATION
function animateFoodToCart(sourceButton) {
  if (!sourceButton) return;

  const cartButton = document.getElementById("view-cart");

  if (!cartButton) return;

  const start = sourceButton.getBoundingClientRect();
  const end = cartButton.getBoundingClientRect();

  const flyer = document.createElement("div");

  flyer.textContent = "🍔";
  flyer.setAttribute("aria-hidden", "true");

  Object.assign(flyer.style, {
    position: "fixed",
    left: (start.left + start.width / 2 - 15) + "px",
    top: (start.top + start.height / 2 - 15) + "px",
    width: "30px",
    height: "30px",
    fontSize: "26px",
    lineHeight: "30px",
    textAlign: "center",
    pointerEvents: "none",
    zIndex: "99999",
    transition: "transform 650ms cubic-bezier(.2,.8,.3,1), opacity 650ms ease"
  });

  document.body.appendChild(flyer);

  // Allow the browser to display the starting position.
  flyer.getBoundingClientRect();

  const moveX =
    end.left + end.width / 2 - (start.left + start.width / 2);

  const moveY =
    end.top + end.height / 2 - (start.top + start.height / 2);

  flyer.style.transform =
    `translate(${moveX}px, ${moveY}px) scale(0.25)`;

  flyer.style.opacity = "0";

  cartButton.animate(
    [
      { transform: "scale(1)" },
      { transform: "scale(1.18)" },
      { transform: "scale(1)" }
    ],
    {
      duration: 350,
      easing: "ease-out"
    }
  );

  setTimeout(() => {
    flyer.remove();
  }, 700);
}

// CART DISPLAY FIX
function updateCartDisplay() {
  const totalItems = cart.reduce(
    (sum, item) => sum + item.quantity,
    0
  );

  const cartCount = document.getElementById("cart-count");

  if (cartCount) {
    cartCount.textContent =
      totalItems + (totalItems === 1 ? " item" : " items");
  }

  const cartButton = document.getElementById("view-cart");

  if (cartButton) {
    cartButton.textContent = `View Cart (${totalItems})`;
  }
}


// VIEW CART PAGE
function showCart() {
  const panel = document.getElementById("cart-panel");

  if (!panel) {
    alert("Cart page not found. Please check the cart HTML.");
    return;
  }

  panel.hidden = false;
  renderCart();
}


// CLOSE CART PAGE
function closeCart() {
  document.getElementById("cart-panel").hidden = true;
}


// DISPLAY CART ITEMS AND TOTAL
function renderCart() {
  const itemsContainer = document.getElementById("cart-items");
  const summaryContainer = document.getElementById("cart-summary");

  if (!itemsContainer || !summaryContainer) {
    alert("Cart display elements are missing.");
    return;
  }

  itemsContainer.replaceChildren();
  summaryContainer.replaceChildren();

  if (cart.length === 0) {
    const message = document.createElement("p");
    message.textContent = "Your cart is empty.";
    itemsContainer.appendChild(message);

    const backButton = document.createElement("button");
    backButton.className = "cart-checkout";
    backButton.textContent = "Continue Shopping";
    backButton.addEventListener("click", closeCart);

    summaryContainer.appendChild(backButton);
    return;
  }

  cart.forEach((item, index) => {
    const card = document.createElement("article");
    card.className = "cart-item";

    const name = document.createElement("h3");
    name.textContent = item.name;

    const price = document.createElement("p");
    price.textContent =
      "Price: " + Number(item.price).toLocaleString() + " ETB";

    const subtotal = document.createElement("p");
    subtotal.textContent =
      "Subtotal: " +
      (Number(item.price) * item.quantity).toLocaleString() +
      " ETB";

    const actions = document.createElement("div");
    actions.className = "cart-actions";

    const decrease = document.createElement("button");
    decrease.textContent = "−";
    decrease.setAttribute("aria-label", "Decrease quantity");
    decrease.addEventListener("click", () => {
      changeCartQuantity(index, -1);
    });

    const quantity = document.createElement("span");

quantity.textContent = String(item.quantity);

quantity.style.display = "inline-flex";
quantity.style.alignItems = "center";
quantity.style.justifyContent = "center";
quantity.style.width = "32px";
quantity.style.minHeight = "40px";
quantity.style.color = "#222";
quantity.style.backgroundColor = "#ffffff";
quantity.style.border = "1px solid #cccccc";
quantity.style.borderRadius = "6px";
quantity.style.fontSize = "18px";
quantity.style.fontWeight = "bold";

    const increase = document.createElement("button");
    increase.textContent = "+";
    increase.setAttribute("aria-label", "Increase quantity");
    increase.addEventListener("click", () => {
      changeCartQuantity(index, 1);
    });

    const remove = document.createElement("button");
    remove.className = "remove-item";
    remove.textContent = "Remove";
    remove.addEventListener("click", () => {
      removeCartItem(index);
    });

    actions.append(decrease, quantity, increase, remove);
    card.append(name, price, subtotal, actions);
    itemsContainer.appendChild(card);
  });

  const total = cart.reduce(
    (sum, item) => sum + Number(item.price) * item.quantity,
    0
  );

  const restaurant = document.createElement("p");
  restaurant.textContent = "Restaurant: " + cart[0].restaurantName;

  const totalHeading = document.createElement("h3");
  totalHeading.textContent =
    "Food Total: " + total.toLocaleString() + " ETB";

  const checkoutButton = document.createElement("button");
  checkoutButton.className = "cart-checkout";
  checkoutButton.textContent = "Continue to Checkout";

  checkoutButton.addEventListener("click", () => {
  showDeliveryForm();
  });
  
  summaryContainer.className = "cart-total";
  summaryContainer.append(restaurant, totalHeading, checkoutButton);
}

// SHOW DELIVERY ADDRESS FORM
function showDeliveryForm() {

  if (!cart.length) {
    alert("Your cart is empty.");
    return;
  }

  summary.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = "Delivery Details";

  const form = document.createElement("form");

  const label = document.createElement("label");

  const address = document.createElement("textarea");

  address.rows = 3;
  address.maxLength = 500;

  address.style.display = "block";
  address.style.width = "100%";

  address.style.marginBottom = "16px";

  label.appendChild(address);

  const submit = document.createElement("button");
  submit.type = "submit";
  submit.className = "cart-checkout";
  submit.textContent = "Place Order";

  const back = document.createElement("button");
  back.type = "button";
  back.className = "cart-checkout";
  back.style.background = "#555";
  back.textContent = "Back to Cart";

  back.addEventListener("click", () => {
    renderCart();
  });

  form.append(label, submit, back);
  summary.append(heading, form);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    }

    const restaurantId = cart[0].restaurantId;

    const multipleRestaurants = cart.some(

      return;
    }

    submit.disabled = true;
    submit.textContent = "Placing Order...";

    try {
      const orderItems = cart.map(item => ({
        menu_item_id: item.id,

      }));

      const { data: sessionCheck, error: sessionError } =
  await supabaseClient.auth.getSession();

if (sessionError) {
  throw sessionError;
}

if (!sessionCheck.session) {
  throw new Error(
    "Your login session has expired. Please sign in again before placing your order."

}

const { data, error } = await supabaseClient.rpc(

  {
    p_restaurant_id: restaurantId,
    p_delivery_address: deliveryAddress,
    p_items: orderItems
  }
);

      if (error) {
        throw error;
      }

      const orderId = Array.isArray(data) ? data[0] : data;

      cart = [];
      updateCartDisplay();

      itemsContainer.replaceChildren();
      summary.replaceChildren();

      const success = document.createElement("h3");
      success.textContent = "Order Placed Successfully!";

      const message = document.createElement("p");
      message.textContent =
        "Your order has been saved. Payment is still pending.";

      const reference = document.createElement("p");
      reference.textContent = "Order reference: " + orderId;

      const closeButton = document.createElement("button");
      closeButton.className = "cart-checkout";
      closeButton.textContent = "Continue Browsing";
      closeButton.addEventListener("click", closeCart);

      summary.append(
        success,
        message,
        reference,
        closeButton
      );

    } catch (error) {
      console.error("Order creation failed:", error);

      alert(
        "We could not place your order.\n\n" +

      );

      submit.disabled = false;
      submit.textContent = "Place Order";
    }
  });
}
  
// INCREASE OR DECREASE QUANTITY
function changeCartQuantity(index, amount) {
  if (!cart[index]) return;

  cart[index].quantity += amount;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  updateCartDisplay();
  renderCart();
}


// REMOVE ITEM FROM CART
function removeCartItem(index) {
  if (!cart[index]) return;

  cart.splice(index, 1);

  updateCartDisplay();
  renderCart();
}


// HOMEPAGE CATEGORY BUTTONS
document.querySelectorAll(".categories > .category").forEach(button => {
  button.addEventListener("click", () => {
    if (selectedRestaurant) {
      return;
    }

    selectedCategory = button.dataset.category;

    document.querySelectorAll(".categories > .category").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    if (selectedCategory !== "All") {
      alert(
        "Open a restaurant first to browse its menu categories."
      );
      return;
    }

    renderRestaurants();
  });
});


// SEARCH RESTAURANTS
document.getElementById("search").addEventListener(
  "input",
  () => {
    if (!selectedRestaurant) {
      renderRestaurants();
    }
  }
);


// START APP
loadRestaurants();
</script>
