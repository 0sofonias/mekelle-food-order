<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e85d04">
<title>Mekelle Food Order</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8f8f8;
  color: #222;
}

header {
  background: #e85d04;
  color: white;
  padding: 22px 18px;
  border-radius: 0 0 22px 22px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

header p {
  margin: 0;
  font-size: 14px;
}

.container {
  padding: 18px;
  max-width: 650px;
  margin: auto;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 22px;
}

h2 {
  font-size: 20px;
  margin-bottom: 14px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 12px;
}

.category {
  border: 1px solid #eee;
  background: white;
  border-radius: 12px;
  padding: 12px 15px;
  white-space: nowrap;
  cursor: pointer;
}

.category.active {
  background: #e85d04;
  color: white;
}

.restaurant {
  background: white;
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: 0 2px 8px #0000000a;
}

.restaurant-image {
  height: 130px;
  background: #ffeadb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
}

.restaurant-info {
  padding: 15px;
}

.restaurant-info h3 {
  margin: 0 0 8px;
}

.restaurant-info p {
  margin: 5px 0;
  color: #666;
  font-size: 14px;
}

.badge {
  display: inline-block;
  margin-top: 8px;
  background: #e5f7e9;
  color: #187438;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 12px;
}

.empty {
  padding: 25px;
  text-align: center;
  color: #777;
}

.cart-bar {
  position: sticky;
  bottom: 10px;
  background: #222;
  color: white;
  padding: 15px;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
}

.cart-bar button {
  background: #e85d04;
  border: 0;
  color: white;
  padding: 10px 15px;
  border-radius: 9px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>🍽️ Mekelle Food Order</h1>
  <p>Your food, your choice, delivered to you.</p>
</header>

<main class="container">

  <input
    class="search"
    id="search"
    type="search"
    placeholder="Search restaurants or food..."
    aria-label="Search restaurants or food"
  >

  <h2>Explore categories</h2>

  <div class="categories">
    <button class="category active"
      data-category="All">🍽️ All</button>

    <button class="category"
      data-category="Traditional">🥘 Traditional</button>

    <button class="category"
      data-category="Fast Food">🍔 Fast Food</button>

    <button class="category"
      data-category="Drinks">🥤 Drinks</button>

    <button class="category"
      data-category="Groceries">🛒 Groceries</button>
  </div>

  <h2>Restaurants in Mekelle</h2>

  <div id="restaurants"></div>

  <div class="cart-bar">
    <div>
      <strong>🛒 My Cart</strong>
      <div id="cart-count">0 items</div>
    </div>

    <button onclick="showCart()">View Cart</button>
  </div>

</main>

<footer>
  Mekelle Food Order<br>
  Built for Mekelle, Ethiopia 🇪🇹
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vkrnonhmyeblmpkgkllo.supabase.co";
const SUPABASE_KEY = "sb_publishable_KaJTzLho3184lRCIPDQc8A_JcCZ3JBb";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let restaurants = [];
let selectedCategory = "All";
let cart = [];
let selectedRestaurant = null;
let menuItems = [];
let menuCategories = [];

async function loadRestaurants() {
  const container = document.getElementById("restaurants");
  container.textContent = "Loading restaurants...";

  const { data, error } = await supabaseClient
    .from("restaurants")
    .select("id, name, description, address, image_url, is_open")
    .eq("is_approved", true)
    .order("name");

  if (error) {
    console.error(error);
    container.textContent = "Could not load restaurants.";
    return;
  }

  restaurants = data || [];
  renderRestaurants();
}

function renderRestaurants() {
  const container = document.getElementById("restaurants");
  container.replaceChildren();

  if (selectedRestaurant) {
    renderMenu();
    return;
  }

  const search = document
    .getElementById("search")
    .value.trim().toLowerCase();

  const list = restaurants.filter(r =>
    [r.name, r.description, r.address]
      .some(value =>
        (value || "").toLowerCase().includes(search)
      )
  );

  if (list.length === 0) {
    container.textContent = "No approved restaurants found.";
    return;
  }

  list.forEach(r => {
    const card = document.createElement("article");
    card.className = "restaurant";

    const info = document.createElement("div");
    info.className = "restaurant-info";

    const name = document.createElement("h3");
    name.textContent = r.name;

    const description = document.createElement("p");
    description.textContent =
      r.description || "Restaurant in Mekelle";

    const address = document.createElement("p");
    address.textContent =
      r.address || "Location to be confirmed";

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = r.is_open ? "Open" : "Currently closed";

    const button = document.createElement("button");
    button.textContent = "View Menu";
    button.disabled = !r.is_open;
    button.addEventListener("click", () => openMenu(r));

    info.append(name, description, address, badge, button);
    card.appendChild(info);
    container.appendChild(card);
  });
}

async function openMenu(restaurant) {
  selectedRestaurant = restaurant;
  selectedCategory = "All";

  const container = document.getElementById("restaurants");
  container.textContent = "Loading menu...";

  const [categoriesResult, itemsResult] = await Promise.all([
    supabaseClient
      .from("menu_categories")
      .select("id, name")
      .eq("restaurant_id", restaurant.id)
      .order("name"),

    supabaseClient
      .from("menu_items")
      .select("id, category_id, name, description, price, image_url")
      .eq("restaurant_id", restaurant.id)
      .eq("is_available", true)
      .order("name")
  ]);

  if (categoriesResult.error || itemsResult.error) {
    console.error(
      categoriesResult.error || itemsResult.error
    );

    container.textContent =
      "Could not load the menu. Please try again.";

    return;
  }

  menuCategories = categoriesResult.data || [];
  menuItems = itemsResult.data || [];

  renderMenu();
}

function renderMenu() {
  const container = document.getElementById("restaurants");
  container.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = selectedRestaurant.name + " — Menu";
  container.appendChild(heading);

  const backButton = document.createElement("button");
  backButton.textContent = "← Back to Restaurants";
  backButton.addEventListener("click", () => {
    selectedRestaurant = null;
    selectedCategory = "All";
    renderRestaurants();
  });

  container.appendChild(backButton);

  const categories = document.createElement("div");
  categories.className = "categories";

  ["All", ...menuCategories.map(c => c.name)].forEach(name => {
    const button = document.createElement("button");
    button.className = "category";
    button.textContent = name;

    if (name === selectedCategory) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      selectedCategory = name;
      renderMenu();
    });

    categories.appendChild(button);
  });

  container.appendChild(categories);

  const filteredItems = menuItems.filter(item => {
    if (selectedCategory === "All") return true;

    const category = menuCategories.find(
      c => c.id === item.category_id
    );

    return category && category.name === selectedCategory;
  });

  if (filteredItems.length === 0) {
    const message = document.createElement("p");
    message.textContent =
      "No food items in this category yet.";
    container.appendChild(message);
    return;
  }

  filteredItems.forEach(item => {
    const card = document.createElement("article");
    card.className = "restaurant";

    const info = document.createElement("div");
    info.className = "restaurant-info";

    const name = document.createElement("h3");
    name.textContent = item.name;

    const description = document.createElement("p");
    description.textContent =
      item.description || "Delicious food";

    const price = document.createElement("p");
    price.textContent =
      Number(item.price).toLocaleString() + " ETB";

    const addButton = document.createElement("button");
    addButton.textContent = "Add to Cart";

    addButton.addEventListener("click", () => {
      addToCart(item);
    });

    info.append(name, description, price, addButton);
    card.appendChild(info);
    container.appendChild(card);
  });
}

function addToCart(item) {
  const existing = cart.find(
    entry => entry.id === item.id
  );

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      id: item.id,
      name: item.name,
      price: Number(item.price),
      quantity: 1,
      restaurantId: selectedRestaurant.id,
      restaurantName: selectedRestaurant.name
    });
  }

  updateCartDisplay();
  alert(item.name + " added to your cart!");
}

function updateCartDisplay() {
  const count = cart.reduce(
    (total, item) => total + item.quantity,
    0
  );

  const cartHeading = [...document.querySelectorAll("h2, h3")]
    .find(el => el.textContent.includes("My Cart"));

  if (cartHeading) {
    const next = cartHeading.nextElementSibling;

    if (next) {
      next.textContent =
        count + (count === 1 ? " item" : " items");
    }
  }
}

function showCart() {
  if (cart.length === 0) {
    alert("Your cart is empty.");
    return;
  }

  const restaurantIds = [...new Set(
    cart.map(item => item.restaurantId)
  )];

  if (restaurantIds.length > 1) {
    alert(
      "Your cart contains items from multiple restaurants. " +
      "Please order from one restaurant at a time."
    );
    return;
  }

  const lines = cart.map(item =>
    `${item.name} × ${item.quantity} = ` +
    `${(item.price * item.quantity).toLocaleString()} ETB`
  );

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  alert(
    "YOUR CART\n\n" +
    lines.join("\n") +
    "\n\nFood total: " + total.toLocaleString() + " ETB" +
    "\n\nCheckout and payment are coming next."
  );
}

document.querySelectorAll(".category").forEach(button => {
  button.addEventListener("click", () => {
    if (selectedRestaurant) return;

    selectedCategory = button.dataset.category;

    document.querySelectorAll(".category").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    if (selectedCategory !== "All") {
      alert(
        "Open a restaurant first to browse its menu categories."
      );
      return;
    }

    renderRestaurants();
  });
});

document.getElementById("search").addEventListener(
  "input",
  () => {
    if (!selectedRestaurant) renderRestaurants();
  }
);

loadRestaurants();

async function loadRestaurants() {
  const container = document.getElementById("restaurants");
  container.textContent = "Loading restaurants...";

  const { data, error } = await supabaseClient
    .from("restaurants")
    .select("id, name, description, address, image_url, is_open")
    .eq("is_approved", true)
    .order("name");

  if (error) {
    container.textContent =
      "Could not load restaurants. Please try again later.";
    console.error("Restaurant loading error:", error.message);
    return;
  }

  restaurants = data || [];
  renderRestaurants();
}

function renderRestaurants() {
  const search = document
    .getElementById("search")
    .value.trim().toLowerCase();

  const container = document.getElementById("restaurants");
  container.replaceChildren();

  const list = restaurants.filter(r =>
    [r.name, r.description, r.address]
      .some(value => (value || "").toLowerCase().includes(search))
  );

  if (selectedCategory !== "All") {
    const message = document.createElement("div");
    message.className = "empty";
    message.textContent =
      "Cuisine filters will be available after restaurant categories are added.";
    container.appendChild(message);
    return;
  }

  if (list.length === 0) {
    const message = document.createElement("div");
    message.className = "empty";
    message.textContent =
      "No approved restaurants yet. Check back soon!";
    container.appendChild(message);
    return;
  }

  list.forEach(r => {
    const card = document.createElement("article");
    card.className = "restaurant";

    const picture = document.createElement("div");
    picture.className = "restaurant-image";

    if (r.image_url) {
      const img = document.createElement("img");
      img.src = r.image_url;
      img.alt = r.name;
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.objectFit = "cover";

      img.onerror = () => {
        img.remove();
        picture.textContent = "🍽️";
      };

      picture.appendChild(img);
    } else {
      picture.textContent = "🍽️";
    }

    const info = document.createElement("div");
    info.className = "restaurant-info";

    const name = document.createElement("h3");
    name.textContent = r.name;

    const description = document.createElement("p");
    description.textContent = r.description || "Restaurant in Mekelle";

    const address = document.createElement("p");
    address.textContent = r.address || "Location to be confirmed";

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = r.is_open ? "Open" : "Currently closed";

    info.append(name, description, address, badge);
    card.append(picture, info);
    container.appendChild(card);
  });
}

document.querySelectorAll(".category").forEach(button => {
  button.addEventListener("click", () => {
    selectedCategory = button.dataset.category;

    document.querySelectorAll(".category").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    renderRestaurants();
  });
});

document.getElementById("search").addEventListener(
  "input",
  renderRestaurants
);

function showCart() {
  alert(
    "Online ordering and payment are still being developed."
  );
}

loadRestaurants();
</script>
  
</body>
</html>
